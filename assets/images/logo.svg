<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" fill="none">
  <defs>
    <linearGradient id="shieldGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="crossGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accentGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Left Icon Mark -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="100" height="100" rx="28" fill="url(#shieldGradFull)" filter="url(#glowFull)" />
    <rect x="2" y="2" width="96" height="96" rx="26" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
    
    <!-- Medical Cross -->
    <rect x="38" y="18" width="24" height="64" rx="8" fill="#ffffff" />
    <rect x="18" y="38" width="64" height="24" rx="8" fill="#ffffff" />

    <!-- Inner Core -->
    <rect x="42" y="24" width="16" height="52" rx="5" fill="url(#crossGradFull)" />
    <rect x="24" y="42" width="52" height="16" rx="5" fill="url(#crossGradFull)" />

    <!-- Pulse Line -->
    <path d="M 26 50 L 38 50 L 44 36 L 52 64 L 58 44 L 64 52 L 74 50" 
          stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <circle cx="52" cy="64" r="3.5" fill="url(#accentGradFull)" />
  </g>

  <!-- Wordmark -->
  <text x="130" y="58" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#0f172a" letter-spacing="-0.5">
    STACK<tspan fill="#0284c7">LY</tspan>
  </text>
  
  <rect x="130" y="70" width="260" height="2" rx="1" fill="#e2e8f0" />
  
  <text x="130" y="88" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="2.8">
    SUPER SPECIALTY HOSPITAL
  </text>
</svg>
