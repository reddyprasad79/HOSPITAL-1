<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield / Hexagon -->
  <rect x="8" y="8" width="104" height="104" rx="30" fill="url(#shieldGrad)" filter="url(#glow)" />
  <rect x="10" y="10" width="100" height="100" rx="28" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Medical Cross Geometry -->
  <!-- Vertical Bar -->
  <rect x="48" y="26" width="24" height="68" rx="8" fill="#ffffff" />
  <!-- Horizontal Bar -->
  <rect x="26" y="48" width="68" height="24" rx="8" fill="#ffffff" />

  <!-- Inner Cyan Glow Cross Core -->
  <rect x="52" y="32" width="16" height="56" rx="5" fill="url(#crossGrad)" />
  <rect x="32" y="52" width="56" height="16" rx="5" fill="url(#crossGrad)" />

  <!-- Center Pulse / Heartbeat Line (White & Red Accent) -->
  <path d="M 34 60 L 48 60 L 54 44 L 62 76 L 68 54 L 74 62 L 86 62" 
        stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <circle cx="62" cy="76" r="3.5" fill="url(#accentGrad)" />

  <!-- Sparkle of Hope (Top Right) -->
  <circle cx="94" cy="26" r="4" fill="#38bdf8" />
</svg>
